    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://hkcvtoozpeybwehqtiif.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://hkcvtoozpeybwehqtiif.supabase.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Critical, inline boot styles — paint before the JS bundle, Tailwind's
      generated CSS, or web fonts arrive, so the first frame is the dark
      background and a loading mark instead of a flash of blank/white.
    -->
    <style>
      html,
      body {
        background-color: #0b0a08;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #0b0a08;
        background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(47, 158, 110, 0.08), transparent 60%);
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .wl-loader-mark {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.02em;
      }
      #initial-loader .wl-loader-mark .tile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 5px;
        color: #0b0a08;
      }
      #initial-loader .wl-loader-mark .tile:nth-child(1) { background: #2f9e6e; }
      #initial-loader .wl-loader-mark .tile:nth-child(2) { background: #c9922f; }
      #initial-loader .wl-loader-mark .tile:nth-child(3) { background: #342f26; color: #978c79; }
      #initial-loader .wl-loader-mark .tile:nth-child(4) { background: #2f9e6e; }
      #initial-loader .wl-loader-mark .tile:nth-child(5) { background: #c9922f; }
      #initial-loader .wl-loader-mark .tile:nth-child(6) { background: #342f26; color: #978c79; }
      #initial-loader .wl-loader-mark .tile:nth-child(7) { background: #2f9e6e; }
      #initial-loader .wl-loader-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2.5px solid rgba(47, 158, 110, 0.2);
        border-top-color: #2f9e6e;
        animation: wl-spin 0.7s linear infinite;
      }
      #initial-loader .wl-loader-caption {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #978c79;
      }
      @keyframes wl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .wl-loader-spinner {
          animation-duration: 1.4s;
        }
      }
    </style>
  </head>
  <body class="bg-[#0b0a08] text-paper antialiased selection:bg-correct-soft selection:text-correct">
    <div id="initial-loader" aria-live="polite" aria-label="Loading Wordezy">
      <div class="wl-loader-mark">
        <span class="tile">W</span>
        <span class="tile">O</span>
        <span class="tile">R</span>
        <span class="tile">D</span>
        <span class="tile">E</span>
        <span class="tile">Z</span>
        <span class="tile">Y</span>
      </div>
      <div class="wl-loader-spinner" role="status"></div>
      <div class="wl-loader-caption">Shuffling the letters&hellip;</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
